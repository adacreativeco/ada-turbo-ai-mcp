[project]
name = "ada-turbo-ai-mcp"
version = "1.0.0"
description = "ADA Creative Co. Agency OS delivers 20+ AI roles over MCP (Model Context Protocol) and a retro Pixel Office Web Visualizer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [
    { name = "ADA Creative Co.", email = "hello@adacreative.co" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "ai-agents",
    "multi-agent",
    "pixel-art",
    "agency-os",
    "claude",
    "cursor",
    "antigravity",
    "llm",
    "gemini",
    "openai"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/adacreativeco/ada-turbo-ai-mcp"
Repository = "https://github.com/adacreativeco/ada-turbo-ai-mcp"
Documentation = "https://github.com/adacreativeco/ada-turbo-ai-mcp#readme"
"Bug Tracker" = "https://github.com/adacreativeco/ada-turbo-ai-mcp/issues"

[project.scripts]
ada-turbo = "server:main"
ada-turbo-ai-mcp = "server:main"
ada-creative-co-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "server.py",
    "src/**/*.py",
    "references/*.md",
    "index.html",
    "karakterler/**/*",
    "animasyonlar/**/*",
    "office-bina/**/*",
    "office-zon/**/*"
]
